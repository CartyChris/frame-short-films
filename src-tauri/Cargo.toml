[package]
name = "frame-desktop"
version = "5.0.0"
edition = "2021"
publish = false
[profile.release]
# Keep proc-macro metadata intact with Rust 1.97 / the macOS 27 linker.
strip = false
[lib]
name = "frame_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
film-core = { path = "../crates/film-core" }
film-storage = { path = "../crates/film-storage" }
[dev-dependencies]
tempfile = "3"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
