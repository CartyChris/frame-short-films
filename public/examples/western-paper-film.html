<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WESTERN CIVILIZATION — a paper film</title>
<style>
  :root{
    --cream:#f4e8d2;
    --cream-dim:rgba(244,232,210,.55);
    --ink:#2b241c;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0908;}
  body{font-family:var(--serif);color:var(--cream);-webkit-font-smoothing:antialiased;}
  #gl{position:fixed;inset:0;display:block;width:100%;height:100%}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}

  .grain{
    position:absolute;inset:-30%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
    opacity:.22;mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(38,22,6,.30) 100%);
  }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 32px;font-size:10px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(255,255,255,.72);mix-blend-mode:difference;
  }
  .hud .idx{opacity:.55;margin-right:10px}
  .hud .era{letter-spacing:.34em}

  /* ---------- big flowing title ---------- */
  #title{
    position:absolute;left:0;right:0;top:24%;text-align:center;
    font-weight:400;font-size:clamp(38px,10.5vw,164px);
    letter-spacing:.10em;line-height:.94;text-indent:.10em;
    white-space:nowrap;will-change:transform,opacity;
    text-shadow:0 2px 0 rgba(255,255,255,.30),0 14px 34px rgba(50,30,10,.28);
  }
  #title.finale{
    top:44%;font-size:clamp(20px,4.4vw,66px);
    letter-spacing:.24em;text-indent:.24em;
  }

  /* ---------- caption flowing across ---------- */
  .cap{
    position:absolute;left:50%;bottom:104px;
    max-width:min(700px,70vw);
    padding:16px 30px;border-radius:2px;
    background:#f7ecd6;color:var(--ink);
    font-size:clamp(12.5px,1.15vw,18px);line-height:1.5;text-align:center;
    box-shadow:0 18px 38px rgba(28,16,4,.34),0 1px 0 rgba(255,255,255,.65) inset;
    will-change:transform,opacity;
  }
  .cap.finale{
    bottom:38%;background:transparent;box-shadow:none;
    color:#3b2c1b;font-size:clamp(18px,2.5vw,38px);
    line-height:1.25;letter-spacing:.01em;max-width:min(940px,82vw);
    text-shadow:0 2px 0 rgba(255,255,255,.35);
  }

  /* ---------- flowing ribbons ---------- */
  .ribbon{
    position:absolute;left:0;right:0;height:30px;overflow:hidden;
  }
  .ribbon.top{bottom:auto;top:54px}
  .ribbon.bot{bottom:0;background:linear-gradient(180deg,rgba(10,9,8,0),rgba(10,9,8,.62))}
  .track{display:flex;width:max-content;will-change:transform}
  .track span{
    white-space:nowrap;padding:7px 0 0;
    font-size:9.5px;letter-spacing:.46em;text-transform:uppercase;
    color:rgba(244,232,210,.52);
  }
  .ribbon.bot .track{animation:slide 52s linear infinite}
  .ribbon.top .track{animation:slideR 71s linear infinite}
  .ribbon.top .track span{color:rgba(244,232,210,.35)}
  @keyframes slide {from{transform:translateX(0)}      to{transform:translateX(-50%)}}
  @keyframes slideR{from{transform:translateX(-50%)}   to{transform:translateX(0)}}

  /* ---------- progress ---------- */
  .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgba(244,232,210,.10)}
  .bar i{display:block;height:100%;width:0%;background:rgba(244,232,210,.85)}

  /* ---------- replay ---------- */
  #replay{
    position:absolute;left:50%;bottom:74px;transform:translateX(-50%);
    padding:10px 26px;border:1px solid rgba(244,232,210,.45);border-radius:999px;
    background:rgba(20,14,8,.45);color:var(--cream);
    font-family:var(--serif);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    cursor:pointer;pointer-events:auto;opacity:0;transition:opacity .6s,background .3s;
    backdrop-filter:blur(4px);
  }
  #replay.on{opacity:1}
  #replay:hover{background:rgba(244,232,210,.15)}

  /* ---------- loader ---------- */
  #loader{
    position:fixed;inset:0;display:grid;place-items:center;background:#0a0908;
    z-index:20;transition:opacity .9s;
    font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(244,232,210,.45);
  }
  #loader.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="overlay">
  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="hud">
    <div><span class="idx" id="idx">01</span><span class="era" id="era">ATHENS · 5TH C. BC</span></div>
    <div>a paper film · 30 sec</div>
  </div>

  <h1 id="title">ATHENS</h1>
  <div class="cap" id="cap">Six thousand citizens, no king — and an argument that refused to end.</div>

  <div class="ribbon top"><div class="track" id="trackTop"></div></div>
  <div class="ribbon bot"><div class="track" id="trackBot"></div></div>

  <div class="bar"><i id="barFill"></i></div>
  <button id="replay">replay</button>
</div>

<div id="loader">printing the paper…</div>
